name: Test W&B Connection

on:
  workflow_dispatch: # Allows you to run this test manually from the UI

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Fixed the typo here!

    - name: Install W&B
      run: pip install wandb

    - name: Verify W&B Login
      env:
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: |
        wandb login
