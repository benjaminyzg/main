name: Model Training & Evaluation

on:
  pull_request:
    branches: [ main ]

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install wandb torch torchvision

    - name: Run Training Script
      env:
        # This auto-logs in the CLI tool without needing an interactive prompt
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      run: python train.py

    # Optional: Automatically post a comment on the PR with the W&B run link
    - name: Report WandB Results to PR
      uses: bencevans/wandb-action@v1
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
